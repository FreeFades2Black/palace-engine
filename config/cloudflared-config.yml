# ~/.cloudflared/config.yml
# Outbound Zero Trust Cloudflare Tunnel routing to local Palace Deck FastAPI station
tunnel: 3f2a1b4c-xxxx-xxxx-xxxx-xxxxxxxxxxxx
credentials-file: /home/free/.cloudflared/3f2a1b4c-xxxx-xxxx-xxxx-xxxxxxxxxxxx.json

ingress:
  - hostname: palace.yourdomain.com
    service: http://localhost:8420
  - service: http_status:404
