# Floating scratchpad for Palace Deck interactive console
windowrulev2 = float, class:^(palace-deck)$
windowrulev2 = size 1100 700, class:^(palace-deck)$
windowrulev2 = center, class:^(palace-deck)$

# Keybind: Super + Shift + M launches or toggles the Palace Station
bind = $mainMod SHIFT, M, exec, chromium --app=http://localhost:8420 --class=palace-deck
